services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cablecheck-db
    environment:
      POSTGRES_USER: cablecheck
      POSTGRES_PASSWORD: cablecheck_local
      POSTGRES_DB: cablecheck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cablecheck -d cablecheck"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: cablecheck-api
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cablecheck:cablecheck_local@db:5432/cablecheck
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
